<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MS Hokej 2026 – Tipovačka</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #0d1b2a;
  --bg2:    #1a3a5c;
  --card:   rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
  --red:    #d62828;
  --blue:   #1a56a0;
  --gold:   #f59e0b;
  --green:  #22c55e;
  --text:   #e8f4fd;
  --muted:  #7cb9e8;
}
body {
  background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%);
  background-attachment: fixed;
  min-height: 100vh;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: var(--text);
  padding-bottom: 80px;
}
input, button, select { font-family: inherit; }

/* ── LOGIN ─────────────────────────────────────────────── */
#login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.login-card {
  background: rgba(10,28,52,0.96);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 28px;
  max-width: 380px; width: 100%;
  text-align: center;
}
.login-logo  { font-size:52px; margin-bottom:8px; }
.login-title { font-size:26px; font-weight:800; color:#fff; letter-spacing:-1px; margin-bottom:4px; }
.login-sub   { color:var(--muted); font-size:14px; margin-bottom:24px; }
.tab-row     { display:flex; background:rgba(0,0,0,0.4); border-radius:10px; padding:3px; margin-bottom:20px; }
.tab { flex:1; padding:9px 0; background:transparent; border:none; color:var(--muted); cursor:pointer; border-radius:8px; font-size:14px; font-weight:600; }
.tab.active  { background:var(--red); color:#fff; }
.field {
  display:block; width:100%;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 10px;
  padding: 13px 14px;
  color: #fff; -webkit-text-fill-color: #fff;
  font-size: 15px;
  margin-bottom: 12px;
  outline: none;
}
.field::placeholder { color: rgba(255,255,255,0.35); }
.field:focus { border-color: rgba(255,255,255,0.45); }
.error-msg  { color:#ff6b6b; font-size:13px; margin-bottom:12px; min-height:18px; }
.btn-primary {
  width:100%; padding:13px 0;
  background:var(--red); border:none; border-radius:10px;
  color:#fff; font-weight:800; font-size:16px; cursor:pointer;
}
.btn-primary:disabled { opacity:.55; cursor:not-allowed; }
.login-hint { color:var(--muted); font-size:13px; margin-top:14px; }

/* ── APP ────────────────────────────────────────────────── */
#app-screen { display:none; }
.app-header { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 0; }
.app-title  { font-size:21px; font-weight:900; letter-spacing:-0.5px; }
.app-sub    { font-size:13px; color:var(--muted); margin-top:2px; }
.btn-logout {
  background:rgba(255,255,255,0.08); border:1px solid var(--border);
  color:var(--muted); border-radius:8px; padding:6px 13px;
  cursor:pointer; font-size:13px;
}
.nav { display:flex; gap:8px; padding:12px 16px 0; }
.nav-btn {
  flex:1; padding:10px 0;
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; color:var(--muted);
  cursor:pointer; font-weight:700; font-size:14px;
}
.nav-btn.active { background:var(--red); border-color:var(--red); color:#fff; }

/* ── FILTERS ────────────────────────────────────────────── */
.filters { display:flex; gap:6px; padding:12px 16px 4px; overflow-x:auto; }
.filter-btn {
  flex-shrink:0; padding:6px 14px;
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; color:var(--muted);
  cursor:pointer; font-size:13px; font-weight:600;
}
.filter-btn.active { background:var(--blue); border-color:#3b82f6; color:#fff; }

/* ── GAME CARDS ─────────────────────────────────────────── */
.game-list  { padding:8px 16px; display:flex; flex-direction:column; gap:10px; }
.game-card  {
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:12px 14px;
}
.game-card.done   { border-color:rgba(214,40,40,0.35); }
.game-card.locked { border-color:rgba(255,255,255,0.06); opacity:.75; }

.card-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.grp-badge   { background:var(--blue); color:#fff; border-radius:5px; font-size:11px; font-weight:800; padding:2px 7px; }
.game-date   { font-size:12px; color:var(--muted); flex:1; }
.pts-badge   { font-size:12px; font-weight:700; padding:2px 8px; border-radius:20px; }
.pts-gold    { background:rgba(245,158,11,0.18); color:var(--gold); }
.pts-silver  { background:rgba(34,197,94,0.18);  color:#4ade80; }
.pts-gray    { background:rgba(255,255,255,0.08); color:#94a3b8; }

.teams   { display:flex; align-items:center; margin-bottom:10px; gap:4px; }
.team-l  { flex:1; font-size:14px; font-weight:700; }
.team-r  { flex:1; font-size:14px; font-weight:700; text-align:right; }
.mid     { width:64px; text-align:center; }
.vs-label    { color:var(--muted); font-size:14px; font-weight:600; }
.final-score { color:var(--gold); font-size:17px; font-weight:900; line-height:1.1; }
.outcome-tag { font-size:11px; color:var(--gold); opacity:.8; }

.tip-row   { display:flex; align-items:center; gap:8px; margin-top:4px; }
.tip-label { font-size:12px; color:var(--muted); width:66px; flex-shrink:0; }

/* Score boxes */
.score-row { display:flex; align-items:center; gap:5px; }
.score-box {
  width:44px; padding:5px 4px;
  background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.20);
  border-radius:8px; color:#fff; -webkit-text-fill-color:#fff;
  font-size:16px; font-weight:700; text-align:center; outline:none;
  -moz-appearance:textfield;
}
.score-box::-webkit-inner-spin-button,
.score-box::-webkit-outer-spin-button { -webkit-appearance:none; }
.score-box:disabled { opacity:.35; }
.score-sep { color:var(--muted); font-weight:800; font-size:16px; }

/* OT/SO selector */
.outcome-sel {
  background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.20);
  border-radius:8px; color:#fff; -webkit-text-fill-color:#fff;
  font-size:13px; font-weight:600; padding:5px 6px; outline:none; cursor:pointer;
  margin-left:4px;
}
.outcome-sel:disabled { opacity:.35; }
.outcome-sel option { background:#1a3a5c; color:#fff; }

/* Lock notice */
.lock-notice { font-size:11px; color:var(--muted); margin-top:6px; font-style:italic; }
.lock-soon   { color:var(--gold); }

/* Admin bar */
.admin-tip-row { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08); }
.btn-iihf {
  margin:12px 16px 0;
  width:calc(100% - 32px);
  padding:10px; background:rgba(245,158,11,0.15);
  border:1px solid var(--gold); border-radius:10px;
  color:var(--gold); font-weight:700; font-size:14px; cursor:pointer;
}
.btn-iihf:disabled { opacity:.5; cursor:not-allowed; }
.iihf-result { margin:6px 16px 0; font-size:13px; color:var(--muted); }

/* ── LEADERBOARD ────────────────────────────────────────── */
.lb-wrap     { padding:8px 16px; }
.section-title { font-size:20px; font-weight:900; margin:8px 0 14px; }
.lb-row {
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:12px 14px; margin-bottom:8px;
}
.lb-row.me   { border-color:var(--red); background:rgba(214,40,40,0.10); }
.lb-pos  { width:32px; font-size:20px; text-align:center; }
.lb-name { flex:1; font-size:15px; font-weight:700; }
.lb-right{ display:flex; align-items:center; gap:10px; }
.lb-stat { font-size:13px; color:var(--muted); }
.lb-pts  { font-size:18px; font-weight:900; color:var(--gold); min-width:50px; text-align:right; }
.lb-note { font-size:12px; color:var(--muted); text-align:center; margin-top:12px; }

.empty   { color:var(--muted); text-align:center; padding:24px; }
.spinner { color:var(--muted); text-align:center; padding:40px; font-size:15px; }
.admin-tag {
  position:fixed; bottom:16px; right:16px;
  background:rgba(245,158,11,0.18); border:1px solid var(--gold);
  border-radius:20px; padding:6px 14px;
  font-size:13px; color:var(--gold); font-weight:700;
  display:none;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏒</div>
    <h1 class="login-title">MS Hokej 2026</h1>
    <p class="login-sub">Švýcarsko · 15–31 května</p>
    <div class="tab-row">
      <button class="tab" id="tab-login" onclick="switchMode('login')">Přihlásit se</button>
      <button class="tab active" id="tab-reg" onclick="switchMode('register')">Registrovat</button>
    </div>
    <input class="field" id="inp-name" type="text"     placeholder="Tvé jméno" autocomplete="username" />
    <input class="field" id="inp-pin"  type="password" placeholder="PIN (min. 2 znaky)" autocomplete="current-password" />
    <div class="error-msg" id="login-error"></div>
    <button class="btn-primary" id="btn-submit" onclick="handleAuth()">Vytvořit profil →</button>
    <p class="login-hint" id="login-hint"></p>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="app-header">
    <div>
      <div class="app-title">🏒 MS Hokej 2026</div>
      <div class="app-sub" id="app-sub"></div>
    </div>
    <button class="btn-logout" onclick="logout()">Odhlásit</button>
  </div>

  <div class="nav">
    <button class="nav-btn active" id="nav-tips" onclick="switchView('tips')">📋 Tipy</button>
    <button class="nav-btn"       id="nav-lb"   onclick="switchView('lb')">🏆 Žebříček</button>
  </div>

  <!-- TIPS VIEW -->
  <div id="view-tips">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Vše</button>
      <button class="filter-btn" onclick="setFilter('A',this)">Skupina A</button>
      <button class="filter-btn" onclick="setFilter('B',this)">Skupina B</button>
      <button class="filter-btn" onclick="setFilter('open',this)">Otevřené</button>
      <button class="filter-btn" onclick="setFilter('untipped',this)">Bez tipu</button>
    </div>
    <div class="game-list" id="game-list"></div>
  </div>

  <!-- LEADERBOARD VIEW -->
  <div id="view-lb" style="display:none">
    <div class="lb-wrap">
      <h2 class="section-title">🏆 Žebříček</h2>
      <div id="lb-content"><div class="spinner">⏳ Načítám...</div></div>
    </div>
  </div>

  <div class="admin-tag" id="admin-tag">⚙️ Admin mód</div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let currentUser = null;
let games       = [];   // ze serveru, obohaceno o tippable
let tips        = {};   // { gameId: {home_score,away_score,outcome} }
let results     = {};   // { gameId: {home_score,away_score,outcome} }
let curFilter   = "all";
let curView     = "tips";
let authMode    = "register";
let pollIv      = null;

const FLAGS = {
  "Kanada":"🇨🇦","Švédsko":"🇸🇪","Česko":"🇨🇿","Dánsko":"🇩🇰","Slovensko":"🇸🇰",
  "Norsko":"🇳🇴","Slovinsko":"🇸🇮","Itálie":"🇮🇹","Finsko":"🇫🇮","USA":"🇺🇸",
  "Švýcarsko":"🇨🇭","Německo":"🇩🇪","Lotyšsko":"🇱🇻","Maďarsko":"🇭🇺",
  "Rakousko":"🇦🇹","V. Británie":"🇬🇧"
};
const fl = t => FLAGS[t] || "🏒";

// ── UTILS ─────────────────────────────────────────────────────────────────────
function calcPoints(tip, res) {
  if (!tip || !res) return null;
  const th=tip.home_score, ta=tip.away_score, to=tip.outcome||"REG";
  const rh=res.home_score,  ra=res.away_score,  ro=res.outcome||"REG";
  if (th===rh && ta===ra && to===ro) return 3;
  const w = (h,a) => h>a?"H":h<a?"A":"D";
  return w(th,ta)===w(rh,ra) && w(th,ta)!=="D" ? 1 : 0;
}

async function api(path, method="GET", body=null) {
  const opts = {method, credentials:"include", headers:{"Content-Type":"application/json"}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Chyba serveru");
  return d;
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function switchMode(m) {
  authMode = m;
  document.getElementById("tab-login").classList.toggle("active", m==="login");
  document.getElementById("tab-reg").classList.toggle("active",   m==="register");
  document.getElementById("btn-submit").textContent = m==="login" ? "Vstoupit →" : "Vytvořit profil →";
  document.getElementById("login-hint").textContent = m==="login" ? "Poprvé? Přepni na Registrovat." : "";
  document.getElementById("login-error").textContent = "";
}

async function handleAuth() {
  const name = document.getElementById("inp-name").value.trim();
  const pin  = document.getElementById("inp-pin").value;
  const err  = document.getElementById("login-error");
  const btn  = document.getElementById("btn-submit");
  if (!name || pin.length < 2) { err.textContent = "Zadej jméno a PIN (min. 2 znaky)"; return; }
  btn.disabled = true; btn.textContent = "⏳ Moment..."; err.textContent = "";
  try {
    await api(authMode==="login" ? "/api/login" : "/api/register", "POST", {name, pin});
    await loadApp(name);
  } catch(e) {
    err.textContent = e.message;
    btn.disabled = false;
    btn.textContent = authMode==="login" ? "Vstoupit →" : "Vytvořit profil →";
  }
}

async function logout() {
  await api("/api/logout","POST");
  clearInterval(pollIv);
  currentUser=null; games=[]; tips={}; results={};
  document.getElementById("app-screen").style.display="none";
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("inp-name").value="";
  document.getElementById("inp-pin").value="";
  switchMode("login");
}

// ── APP INIT ──────────────────────────────────────────────────────────────────
async function loadApp(name) {
  currentUser = name;
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app-screen").style.display="block";
  document.getElementById("admin-tag").style.display = name==="Admin" ? "block" : "none";

  const [gData, tData, rData] = await Promise.all([
    api("/api/games"), api("/api/tips"), api("/api/results")
  ]);
  games   = gData.games;
  tips    = tData.tips;
  results = rData.results;

  updateHeader();
  renderGames();
  if (name==="Admin") renderAdminButtons();

  clearInterval(pollIv);
  pollIv = setInterval(async () => {
    const [gData2, rData2] = await Promise.all([api("/api/games"), api("/api/results")]);
    games   = gData2.games;
    results = rData2.results;
    updateHeader();
    renderGames();
    if (curView==="lb") renderLeaderboard();
  }, 30000);
}

window.addEventListener("load", async () => {
  switchMode("register");
  try {
    const d = await api("/api/me");
    if (d.name) await loadApp(d.name);
  } catch {}
});
document.getElementById("inp-pin").addEventListener("keydown", e=>{ if(e.key==="Enter") handleAuth(); });
document.getElementById("inp-name").addEventListener("keydown", e=>{ if(e.key==="Enter") handleAuth(); });

// ── VIEWS ─────────────────────────────────────────────────────────────────────
function switchView(v) {
  curView = v;
  document.getElementById("nav-tips").classList.toggle("active", v==="tips");
  document.getElementById("nav-lb").classList.toggle("active",   v==="lb");
  document.getElementById("view-tips").style.display = v==="tips" ? "block" : "none";
  document.getElementById("view-lb").style.display   = v==="lb"   ? "block" : "none";
  if (v==="lb") renderLeaderboard();
}

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderGames();
}

function updateHeader() {
  const myPts  = games.reduce((s,g)=>{ const p=calcPoints(tips[g.id],results[g.id]); return s+(p||0); },0);
  const tipped = games.filter(g=>tips[g.id]).length;
  document.getElementById("app-sub").innerHTML =
    `Ahoj, <strong>${currentUser}</strong> · ${myPts} bodů · ${tipped}/${games.length} tipů`;
}

// ── RENDER GAMES ──────────────────────────────────────────────────────────────
function renderGames() {
  const list = document.getElementById("game-list");
  const filtered = games.filter(g => {
    if (curFilter==="A")        return g.group==="A";
    if (curFilter==="B")        return g.group==="B";
    if (curFilter==="open")     return g.tippable;
    if (curFilter==="untipped") return !tips[g.id] && g.tippable;
    return true;
  });

  if (!filtered.length) { list.innerHTML='<p class="empty">Žádné zápasy.</p>'; return; }

  list.innerHTML = filtered.map(g => gameCardHTML(g)).join("");
}

function gameCardHTML(g) {
  const tip  = tips[g.id];
  const res  = results[g.id];
  const done = !!res;
  const locked = !g.tippable && !done;

  const pts = calcPoints(tip, res);
  let ptsBadge = "";
  if (pts !== null) {
    const cls = pts===3?"pts-gold":pts===1?"pts-silver":"pts-gray";
    const lbl = pts===3?"🎯 +3":pts===1?"✅ +1":"❌ 0";
    ptsBadge = `<span class="pts-badge ${cls}">${lbl}</span>`;
  }

  // Střed — výsledek nebo vs
  let midHtml;
  if (done) {
    const oc = res.outcome||"REG";
    const ocLabel = oc==="OT"?" <span class='outcome-tag'>OT</span>":oc==="SO"?" <span class='outcome-tag'>SO</span>":"";
    midHtml = `<span class="final-score">${res.home_score}:${res.away_score}${ocLabel}</span>`;
  } else {
    midHtml = `<span class="vs-label">vs</span>`;
  }

  // Tip sekce
  const tipH = tip ? tip.home_score : "";
  const tipA = tip ? tip.away_score : "";
  const tipOC = tip ? (tip.outcome||"REG") : "REG";
  const dis  = (!g.tippable || done) ? "disabled" : "";

  // Countdown / lock notice
  let lockHtml = "";
  if (!done) {
    if (!g.tippable) {
      lockHtml = `<div class="lock-notice">🔒 Tipování uzavřeno</div>`;
    } else if (g.minutes_to_deadline <= 120) {
      lockHtml = `<div class="lock-notice lock-soon">⏰ Uzavírá se za ${g.minutes_to_deadline} min</div>`;
    }
  }

  // OT/SO selektor — viditelný jen pokud tipér zadá skóre (vždy zobrazíme)
  const outcomeSelector = `
    <select class="outcome-sel" id="oc-${g.id}" ${dis} onchange="onOutcomeChange('${g.id}')">
      <option value="REG" ${tipOC==="REG"?"selected":""}>Reg.</option>
      <option value="OT"  ${tipOC==="OT" ?"selected":""}>OT</option>
      <option value="SO"  ${tipOC==="SO" ?"selected":""}>SO</option>
    </select>`;

  // Admin řádek pro výsledek
  let adminRow = "";
  if (currentUser==="Admin") {
    const rH  = done ? res.home_score : "";
    const rA  = done ? res.away_score : "";
    const rOC = done ? (res.outcome||"REG") : "REG";
    adminRow = `
      <div class="tip-row admin-tip-row">
        <span class="tip-label" style="color:#f59e0b">Výsledek:</span>
        <div class="score-row">
          <input class="score-box" type="number" min="0" max="20" value="${rH}" placeholder="–"
            onchange="saveResult('${g.id}','home',this.value)">
          <span class="score-sep">:</span>
          <input class="score-box" type="number" min="0" max="20" value="${rA}" placeholder="–"
            onchange="saveResult('${g.id}','away',this.value)">
          <select class="outcome-sel" id="res-oc-${g.id}" onchange="saveResultOutcome('${g.id}')">
            <option value="REG" ${rOC==="REG"?"selected":""}>Reg.</option>
            <option value="OT"  ${rOC==="OT" ?"selected":""}>OT</option>
            <option value="SO"  ${rOC==="SO" ?"selected":""}>SO</option>
          </select>
        </div>
      </div>`;
  }

  const cardClass = done ? "game-card done" : locked ? "game-card locked" : "game-card";

  return `
    <div class="${cardClass}">
      <div class="card-header">
        <span class="grp-badge">${g.group}</span>
        <span class="game-date">${g.display_date} · ${g.time}</span>
        ${ptsBadge}
      </div>
      <div class="teams">
        <span class="team-l">${fl(g.home)} ${g.home}</span>
        <div class="mid">${midHtml}</div>
        <span class="team-r">${g.away} ${fl(g.away)}</span>
      </div>
      <div class="tip-row">
        <span class="tip-label">Tvůj tip:</span>
        <div class="score-row">
          <input class="score-box" type="number" min="0" max="20" value="${tipH}" placeholder="–" ${dis}
            id="tip-h-${g.id}" onchange="onScoreChange('${g.id}')">
          <span class="score-sep">:</span>
          <input class="score-box" type="number" min="0" max="20" value="${tipA}" placeholder="–" ${dis}
            id="tip-a-${g.id}" onchange="onScoreChange('${g.id}')">
          ${outcomeSelector}
        </div>
      </div>
      ${lockHtml}
      ${adminRow}
    </div>`;
}

// ── TIP SAVING ────────────────────────────────────────────────────────────────
const tipTimers = {};

function onScoreChange(gid) { scheduleTipSave(gid); }
function onOutcomeChange(gid) { scheduleTipSave(gid); }

function scheduleTipSave(gid) {
  clearTimeout(tipTimers[gid]);
  tipTimers[gid] = setTimeout(() => flushTip(gid), 700);
}

async function flushTip(gid) {
  const hEl = document.getElementById(`tip-h-${gid}`);
  const aEl = document.getElementById(`tip-a-${gid}`);
  const ocEl = document.getElementById(`oc-${gid}`);
  if (!hEl || !aEl) return;
  const h  = hEl.value;
  const a  = aEl.value;
  const oc = ocEl ? ocEl.value : "REG";
  if (h===""||a==="") return;
  try {
    await api("/api/tips","POST",{game_id:gid, home_score:+h, away_score:+a, outcome:oc});
    tips[gid] = {home_score:+h, away_score:+a, outcome:oc};
    updateHeader();
  } catch(e) {
    alert("Tip se nepodařilo uložit: "+e.message);
  }
}

// ── RESULT SAVING ─────────────────────────────────────────────────────────────
const resBuffers = {};
const resTimers  = {};

function saveResult(gid, side, val) {
  if (!resBuffers[gid]) resBuffers[gid] = { home_score:"", away_score:"", ...results[gid] };
  resBuffers[gid][side==="home"?"home_score":"away_score"] = val;
  scheduleResultSave(gid);
}

function saveResultOutcome(gid) {
  const el = document.getElementById(`res-oc-${gid}`);
  if (!resBuffers[gid]) resBuffers[gid] = { home_score:"", away_score:"", ...results[gid] };
  resBuffers[gid].outcome = el.value;
  scheduleResultSave(gid);
}

function scheduleResultSave(gid) {
  clearTimeout(resTimers[gid]);
  resTimers[gid] = setTimeout(() => flushResult(gid), 700);
}

async function flushResult(gid) {
  const b = resBuffers[gid];
  if (!b || b.home_score===""||b.away_score==="") return;
  const oc = b.outcome || "REG";
  try {
    await api("/api/results","POST",{game_id:gid, home_score:+b.home_score, away_score:+b.away_score, outcome:oc});
    results[gid] = {home_score:+b.home_score, away_score:+b.away_score, outcome:oc};
    renderGames();
    updateHeader();
  } catch(e) {
    alert("Výsledek se nepodařilo uložit: "+e.message);
  }
}

// ── ADMIN BUTTONS ─────────────────────────────────────────────────────────────
function renderAdminButtons() {
  // Přidej tlačítko pro IIHF scraping pod game list
  const existing = document.getElementById("iihf-btn-wrap");
  if (existing) return;
  const wrap = document.createElement("div");
  wrap.id = "iihf-btn-wrap";
  wrap.innerHTML = `
    <button class="btn-iihf" id="btn-iihf" onclick="fetchIIHF()">
      🌐 Načíst výsledky z IIHF.com
    </button>
    <div class="iihf-result" id="iihf-msg"></div>`;
  document.getElementById("view-tips").appendChild(wrap);
}

async function fetchIIHF() {
  const btn = document.getElementById("btn-iihf");
  const msg = document.getElementById("iihf-msg");
  btn.disabled = true; btn.textContent="⏳ Načítám z IIHF...";
  try {
    const d = await api("/api/fetch-iihf");
    msg.textContent = d.message;
    msg.style.color = d.ok ? "#4ade80" : "#f59e0b";
    if (d.ok) {
      const rData = await api("/api/results");
      results = rData.results;
      renderGames();
      updateHeader();
    }
  } catch(e) {
    msg.textContent = "Chyba: "+e.message;
    msg.style.color = "#ff6b6b";
  }
  btn.disabled = false; btn.textContent="🌐 Načíst výsledky z IIHF.com";
}

// ── LEADERBOARD ───────────────────────────────────────────────────────────────
async function renderLeaderboard() {
  const el = document.getElementById("lb-content");
  el.innerHTML='<div class="spinner">⏳ Načítám...</div>';
  try {
    const {leaderboard} = await api("/api/leaderboard");
    if (!leaderboard.length) { el.innerHTML='<p class="empty">Zatím žádní hráči.</p>'; return; }
    const m = ["🥇","🥈","🥉"];
    el.innerHTML = leaderboard.map((r,i)=>`
      <div class="lb-row${r.name===currentUser?" me":""}">
        <span class="lb-pos">${m[i]||`${i+1}.`}</span>
        <span class="lb-name">${r.name}${r.name===currentUser?" (ty)":""}</span>
        <div class="lb-right">
          <span class="lb-stat">🎯 ${r.exact}</span>
          <span class="lb-stat">✅ ${r.correct}</span>
          <span class="lb-pts">${r.total} b.</span>
        </div>
      </div>`).join("") +
      '<p class="lb-note">🎯 přesný výsledek + způsob (OT/SO) = 3 b. · ✅ správný vítěz = 1 b.</p>';
  } catch(e) {
    el.innerHTML=`<p class="empty">Chyba: ${e.message}</p>`;
  }
}
</script>
